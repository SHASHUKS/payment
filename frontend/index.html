<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drunix Fintech App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="card">
    <h2>Drunix Network Hub</h2>
    <form id="fintechForm">
        <label for="action">Action (Problem Statement):</label>
        <select id="action" required>
            <option value="Real-Time Payment">Real-Time Payment</option>
            <option value="Asset Tokenization">Asset Tokenization</option>
            <option value="Cross-Border Remittance">Cross-Border Remittance</option>
            <option value="Financial Inclusion">Financial Inclusion</option>
        </select>

        <label for="amount">Amount (₹):</label>
        <input type="number" id="amount" placeholder="Enter amount" required min="1">

        <button type="submit">Execute Transaction</button>
    </form>
    
    <div id="result"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
